name: Windows real sites

# Manual evidence run (W4), not a merge gate: the actual App on Windows opens
# real third-party sites (Excalidraw, Photopea) in two connection profiles
# through its home, as the Linux real-site runs did. Third-party sites change
# and can be slow, so this is dispatched by hand for a given ref and never
# runs on pull requests or pushes. Anonymous use only: synthetic markers, no
# sign-in anywhere real.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The takosumi-mobile ref (branch, tag or commit) to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: takosumi-mobile-windows-real-sites-${{ inputs.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # The same sibling revisions as ci.yml (a unit test keeps them equal).
  MOBILE_KIT_SOURCE_REF: 2e1aeff1f88c4370889acb68b99081c32f5a6740
  TAKOSUMI_SOURCE_REF: d6347b169dc04f5036218cfb59a7e91b7d489176

jobs:
  windows-real-sites:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target-w3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          path: takosumi-mobile
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tako0614/mobile-kit
          ref: ${{ env.MOBILE_KIT_SOURCE_REF }}
          path: mobile-kit
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tako0614/takosumi
          ref: ${{ env.TAKOSUMI_SOURCE_REF }}
          path: takosumi
          sparse-checkout: contract
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: takosumi-mobile
      # The App bundles the built home (tauri/custom-protocol).
      - run: bun run build
        working-directory: takosumi-mobile
      - name: W3 runner unit tests
        working-directory: takosumi-mobile
        run: |
          python -B native-tests/desktop/test_windows_browser_process.py -v
          if ($LASTEXITCODE -ne 0) { throw "W3 runner unit tests failed (exit $LASTEXITCODE)" }
      # Tauri's home needs the Evergreen WebView2 Runtime; name it, or stop
      # here with that reason instead of a failed App start.
      - name: WebView2 Runtime
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $versions = foreach ($key in @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKLM:\SOFTWARE\$client", "HKCU:\Software\$client")) {
            (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
          }
          $version = @($versions | Where-Object { $_ -and $_ -ne '0.0.0.0' }) | Select-Object -First 1
          if (-not $version) { throw 'The WebView2 Runtime is not installed on this runner' }
          "WebView2 Runtime $version"
      - name: Locked CEF version
        id: cef
        shell: pwsh
        working-directory: takosumi-mobile
        run: |
          $lock = Get-Content native-tests/cef-candidate/Cargo.lock
          $index = [array]::IndexOf($lock, 'name = "cef-dll-sys"')
          if ($index -lt 0 -or $lock[$index + 1] -notmatch '^version = "(.+)"$') { throw 'cef-dll-sys is not locked' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      # The cef-windows job's CEF distribution cache (same key).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cef-sdk
        with:
          path: |
            ${{ runner.temp }}/cef
            !${{ runner.temp }}/cef/*/*.tar.bz2
          key: cef-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: w3-cargo
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target-w3
          key: cef-windows-app-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('takosumi-mobile/native-tests/cef-candidate/Cargo.lock', 'takosumi-mobile/src-tauri/Cargo.lock') }}
          restore-keys: cef-windows-app-cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: CMake and Ninja for the CEF wrapper
        shell: pwsh
        run: |
          cmake --version
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            # Visual Studio ships Ninja with its CMake tools.
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
            $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
            if (-not (Test-Path (Join-Path $ninja 'ninja.exe'))) { throw 'Ninja is not available' }
            Add-Content -Path $env:GITHUB_PATH -Value $ninja
            & (Join-Path $ninja 'ninja.exe') --version
          } else {
            ninja --version
          }
          rustc --version
          cargo --version
          python --version
      - name: Build takosumi-cef-browser-process (fixture-inspection, unsandboxed candidate) and takosumi-browser-guard
        id: browser-build
        working-directory: takosumi-mobile
        env:
          CEF_PATH: ${{ runner.temp }}\cef
        run: cargo build --locked --manifest-path native-tests/cef-candidate/Cargo.toml --features fixture-inspection,windows-unsandboxed-candidate --bin takosumi-cef-browser-process --bin takosumi-browser-guard
      # Line tables keep panics' locations while the App's debug build (and
      # its cache) stays small.
      - name: Build the App with native-browser-process-fixture
        id: app-build
        working-directory: takosumi-mobile
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features native-browser-process-fixture
      - name: Fixture site TLS (disposable CA trusted for this run)
        id: w4-tls
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' }}
        working-directory: takosumi-mobile
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File native-tests/desktop/windows_fixture_tls.ps1 -Out "$env:RUNNER_TEMP\w4-tls"
          if ($LASTEXITCODE -ne 0) { throw "The fixture TLS setup failed (exit $LASTEXITCODE)" }
      # Excalidraw: the app home's link leads to the real site; one case, the
      # first launch only. The site may be slow or change: a failure here is
      # evidence, not a regression gate.
      - name: Real site cases (excalidraw)
        id: w4-excalidraw
        if: ${{ !cancelled() && steps.w4-tls.outcome == 'success' }}
        timeout-minutes: 25
        working-directory: takosumi-mobile
        run: |
          $name = 'sumi-w4-excalidraw'
          $case = Join-Path ([System.IO.Path]::GetTempPath()) $name
          "W4_CASE_EXCALIDRAW=$case" >> $env:GITHUB_ENV
          "W4_APP_DATA_EXCALIDRAW=$env:LOCALAPPDATA\com.takosumi.fixture.browserprocess.$name" >> $env:GITHUB_ENV
          $tls = Join-Path $env:RUNNER_TEMP 'w4-tls'
          $log = Join-Path $env:RUNNER_TEMP 'w4-excalidraw.log'
          python -B native-tests/desktop/windows_browser_process.py --binary "$env:CARGO_TARGET_DIR\debug\takosumi-mobile.exe" --browser "$env:CARGO_TARGET_DIR\debug\takosumi-cef-browser-process.exe" --guard "$env:CARGO_TARGET_DIR\debug\takosumi-browser-guard.exe" --data $case --tls-cert "$tls\cert.pem" --tls-key "$tls\key.pem" --tls-ca "$tls\ca.pem" --real-site excalidraw | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Excalidraw real-site cases failed (exit $LASTEXITCODE)" }
          $excalidrawCases = @(
            'excalidraw/separate-profiles',
            'excalidraw/home-by-window-switch',
            'excalidraw/reuse-raises-window',
            'excalidraw/quit-cancel-stops',
            'excalidraw/quit-partial-order',
            'excalidraw/quit-completes',
            'excalidraw/no-process-left',
            'excalidraw/no-opener-request'
          )
          foreach ($case_name in $excalidrawCases) {
            if (-not (Select-String -Path $log -Pattern "^PASS case $([regex]::Escape($case_name))$" -Quiet)) { throw "Real-site case $case_name did not pass" }
          }
          $excalidrawCount = @(Select-String -Path $log -Pattern '^PASS case ').Count
          if ($excalidrawCount -ne 8) { throw "Expected exactly 8 Excalidraw cases, saw $excalidrawCount" }
          $summary = Get-Content -Raw (Join-Path $case 'summary.json') | ConvertFrom-Json
          if ($summary.passed -ne $true) { throw 'The Excalidraw summary did not pass' }
      # Photopea: the app home's link leads to the real site; one case, the
      # first launch only. The site may be slow or change: a failure here is
      # evidence, not a regression gate.
      - name: Real site cases (photopea)
        id: w4-photopea
        if: ${{ !cancelled() && steps.w4-tls.outcome == 'success' }}
        timeout-minutes: 25
        working-directory: takosumi-mobile
        run: |
          $name = 'sumi-w4-photopea'
          $case = Join-Path ([System.IO.Path]::GetTempPath()) $name
          "W4_CASE_PHOTOPEA=$case" >> $env:GITHUB_ENV
          "W4_APP_DATA_PHOTOPEA=$env:LOCALAPPDATA\com.takosumi.fixture.browserprocess.$name" >> $env:GITHUB_ENV
          $tls = Join-Path $env:RUNNER_TEMP 'w4-tls'
          $log = Join-Path $env:RUNNER_TEMP 'w4-photopea.log'
          python -B native-tests/desktop/windows_browser_process.py --binary "$env:CARGO_TARGET_DIR\debug\takosumi-mobile.exe" --browser "$env:CARGO_TARGET_DIR\debug\takosumi-cef-browser-process.exe" --guard "$env:CARGO_TARGET_DIR\debug\takosumi-browser-guard.exe" --data $case --tls-cert "$tls\cert.pem" --tls-key "$tls\key.pem" --tls-ca "$tls\ca.pem" --real-site photopea | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Photopea real-site cases failed (exit $LASTEXITCODE)" }
          $photopeaCases = @(
            'photopea/separate-profiles',
            'photopea/home-by-window-switch',
            'photopea/reuse-raises-window',
            'photopea/quit-cancel-stops',
            'photopea/quit-partial-order',
            'photopea/quit-completes',
            'photopea/no-process-left',
            'photopea/no-opener-request'
          )
          foreach ($case_name in $photopeaCases) {
            if (-not (Select-String -Path $log -Pattern "^PASS case $([regex]::Escape($case_name))$" -Quiet)) { throw "Real-site case $case_name did not pass" }
          }
          $photopeaCount = @(Select-String -Path $log -Pattern '^PASS case ').Count
          if ($photopeaCount -ne 8) { throw "Expected exactly 8 Photopea cases, saw $photopeaCount" }
          $summary = Get-Content -Raw (Join-Path $case 'summary.json') | ConvertFrom-Json
          if ($summary.passed -ne $true) { throw 'The Photopea summary did not pass' }
      - name: Remove the fixture CA
        if: ${{ always() && steps.w4-tls.outcome != 'skipped' }}
        working-directory: takosumi-mobile
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File native-tests/desktop/windows_fixture_tls.ps1 -Out "$env:RUNNER_TEMP\w4-tls" -Remove
          if ($LASTEXITCODE -ne 0) { throw "The fixture CA was not removed (exit $LASTEXITCODE)" }
      # The cases' receipts, markers and logs, and each profile's browser logs.
      - name: Keep the real-site cases
        if: ${{ !cancelled() && (env.W4_CASE_EXCALIDRAW != '' || env.W4_CASE_PHOTOPEA != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-real-sites-cases
          path: |
            ${{ env.W4_CASE_EXCALIDRAW }}
            ${{ env.W4_APP_DATA_EXCALIDRAW }}/browser-process-experiment/*/*.log
            ${{ env.W4_CASE_PHOTOPEA }}
            ${{ env.W4_APP_DATA_PHOTOPEA }}/browser-process-experiment/*/*.log
          if-no-files-found: warn
          retention-days: 14
