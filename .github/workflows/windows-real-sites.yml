name: Windows real sites

# Manual evidence run (W4), never a merge gate: the actual App on Windows
# opens real third-party sites (Excalidraw, Photopea) in two connection
# profiles through its home, as the Linux real-site runs did. Third-party
# sites change and can be slow, so it runs only when asked: dispatched from
# the default branch for a ref of this repository, or by adding the label
# `windows-real-sites` to a pull request (which tests that pull request's
# head commit). A dispatch runs in the default branch's context and cache
# scope, so its ref must be a branch, tag or commit reachable from a branch
# of this repository, never a pull request ref; fork pull requests: use the
# label, after review. No other pull request event and no push runs it.
# Anonymous use only: synthetic markers, no sign-in anywhere real.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The takosumi-mobile ref to test (a branch, tag or commit reachable from a branch of this repository; not a pull request ref)
        required: true
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # The same sibling revisions as ci.yml (a unit test keeps them equal).
  MOBILE_KIT_SOURCE_REF: c6862bb0ae23f62957287f49d4bd79ceadca6a94
  TAKOSUMI_SOURCE_REF: d6347b169dc04f5036218cfb59a7e91b7d489176

jobs:
  windows-real-sites:
    # Only a dispatch, or the `windows-real-sites` label being added.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'windows-real-sites' }}
    # On the job, after its `if`: a run for any other label skips the job and
    # so never enters this group (where it could cancel a pending real run).
    # A dispatch is keyed on its input, not the commit it resolves to: a job's
    # group is fixed when it is queued, before any of its steps runs (keying
    # on the resolved commit would take a separate resolving job).
    concurrency:
      group: takosumi-mobile-windows-real-sites-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target-w3
      # The ref under test: the dispatch input, or the labeled pull request's head.
      TEST_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
    steps:
      # A dispatch tests only this repository's own commits (see the header):
      # its branches and tags, to resolve the input and check reachability.
      - name: This repository's branches (dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ref-check
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Revision under test
        id: test-ref
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:EVENT -ne 'workflow_dispatch') {
            # The labeled pull request's own head.
            "sha=$env:HEAD_SHA" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $ref = $env:TEST_REF
          if ($ref -match '^(refs/)?pull/') {
            throw "inputs.ref '$ref' is a pull request ref. A dispatch runs in the default branch's context and cache scope, so it tests only commits reachable from this repository's branches: add the label windows-real-sites to the pull request instead (for a fork's, after review)."
          }
          if ($ref -notmatch '^[A-Za-z0-9][A-Za-z0-9._/-]*$') {
            throw "inputs.ref '$ref' is not a branch, tag or commit name"
          }
          $sha = $null
          foreach ($candidate in @("refs/remotes/origin/$($ref -replace '^refs/heads/', '')", "refs/tags/$($ref -replace '^refs/tags/', '')", $ref)) {
            $resolved = git -C ref-check rev-parse --verify --quiet "$($candidate)^{commit}"
            if ($LASTEXITCODE -eq 0 -and $resolved) { $sha = "$resolved".Trim(); break }
          }
          if (-not $sha) {
            throw "inputs.ref '$ref' is not a branch, tag or commit of this repository's branches and tags. A fork's commit is tested with the label windows-real-sites on its pull request, after review."
          }
          $branches = @(git -C ref-check branch -r --contains $sha --format='%(refname)' | Where-Object { $_ -like 'refs/remotes/origin/*' -and $_ -ne 'refs/remotes/origin/HEAD' })
          if ($LASTEXITCODE -ne 0 -or $branches.Count -eq 0) {
            throw "inputs.ref '$ref' ($sha) is not reachable from a branch of this repository; push it to a branch, or for a pull request use the label windows-real-sites (for a fork's, after review)."
          }
          "Testing $sha, reachable from $($branches[0])"
          "sha=$sha" >> $env:GITHUB_OUTPUT
          exit 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.test-ref.outputs.sha }}
          path: takosumi-mobile
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tako0614/mobile-kit
          ref: ${{ env.MOBILE_KIT_SOURCE_REF }}
          path: mobile-kit
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tako0614/takosumi
          ref: ${{ env.TAKOSUMI_SOURCE_REF }}
          path: takosumi
          sparse-checkout: contract
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: takosumi-mobile
      # The App bundles the built home (tauri/custom-protocol).
      - run: bun run build
        working-directory: takosumi-mobile
      - name: W3 runner unit tests
        working-directory: takosumi-mobile
        run: |
          python -B native-tests/desktop/test_windows_browser_process.py -v
          if ($LASTEXITCODE -ne 0) { throw "W3 runner unit tests failed (exit $LASTEXITCODE)" }
      # Tauri's home needs the Evergreen WebView2 Runtime; name it, or stop
      # here with that reason instead of a failed App start.
      - name: WebView2 Runtime
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $versions = foreach ($key in @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKLM:\SOFTWARE\$client", "HKCU:\Software\$client")) {
            (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
          }
          $version = @($versions | Where-Object { $_ -and $_ -ne '0.0.0.0' }) | Select-Object -First 1
          if (-not $version) { throw 'The WebView2 Runtime is not installed on this runner' }
          "WebView2 Runtime $version"
      - name: Locked CEF version
        id: cef
        shell: pwsh
        working-directory: takosumi-mobile
        run: |
          $lock = Get-Content native-tests/cef-candidate/Cargo.lock
          $index = [array]::IndexOf($lock, 'name = "cef-dll-sys"')
          if ($index -lt 0 -or $lock[$index + 1] -notmatch '^version = "(.+)"$') { throw 'cef-dll-sys is not locked' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      # The cef-windows job's CEF distribution cache (same key).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cef-sdk
        with:
          path: |
            ${{ runner.temp }}/cef
            !${{ runner.temp }}/cef/*/*.tar.bz2
          key: cef-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: w3-cargo
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target-w3
          key: cef-windows-app-cargo-w7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('takosumi-mobile/native-tests/cef-candidate/Cargo.lock', 'takosumi-mobile/src-tauri/Cargo.lock') }}
          restore-keys: |
            cef-windows-app-cargo-w7-${{ runner.os }}-${{ runner.arch }}-
            cef-windows-app-cargo-crt-${{ runner.os }}-${{ runner.arch }}-
            cef-windows-app-cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: CMake and Ninja for the CEF wrapper
        shell: pwsh
        run: |
          cmake --version
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            # Visual Studio ships Ninja with its CMake tools.
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
            $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
            if (-not (Test-Path (Join-Path $ninja 'ninja.exe'))) { throw 'Ninja is not available' }
            Add-Content -Path $env:GITHUB_PATH -Value $ninja
            & (Join-Path $ninja 'ninja.exe') --version
          } else {
            ninja --version
          }
          rustc --version
          cargo --version
          python --version
      # The sandboxed browser (W7): the DLL built with windows-sandbox, staged
      # beside CEF's bootstrap.exe renamed to takosumi-cef-browser-process.exe
      # (scripts/stage-windows-cef.mjs --fixture), as in ci.yml's W3 job.
      - name: Build and stage the sandboxed browser (fixture-inspection) and takosumi-browser-guard
        id: browser-build
        working-directory: takosumi-mobile
        env:
          CEF_PATH: ${{ runner.temp }}\cef
        run: |
          Push-Location native-tests/cef-candidate
          cargo build --locked --features fixture-inspection,windows-sandbox --lib --bin takosumi-browser-guard
          $built = $LASTEXITCODE
          Pop-Location
          if ($built -ne 0) { throw "The browser build failed (exit $built)" }
          $cef = @(Get-ChildItem -Path $env:CEF_PATH -Directory -Recurse -Depth 1 -Filter cef_windows_x86_64)
          if ($cef.Count -ne 1) { throw "Expected one CEF distribution under $env:CEF_PATH, found $($cef.Count)" }
          node scripts/stage-windows-cef.mjs --fixture --cef $cef[0].FullName --bin "$env:CARGO_TARGET_DIR\debug" --out "$env:RUNNER_TEMP\w4-stage"
          if ($LASTEXITCODE -ne 0) { throw "The fixture stage failed (exit $LASTEXITCODE)" }
      # Line tables keep panics' locations while the App's debug build (and
      # its cache) stays small.
      - name: Build the App with native-browser-process-fixture
        id: app-build
        working-directory: takosumi-mobile
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features native-browser-process-fixture
      - name: Fixture site TLS (disposable CA trusted for this run)
        id: w4-tls
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' }}
        working-directory: takosumi-mobile
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File native-tests/desktop/windows_fixture_tls.ps1 -Out "$env:RUNNER_TEMP\w4-tls"
          if ($LASTEXITCODE -ne 0) { throw "The fixture TLS setup failed (exit $LASTEXITCODE)" }
      # Excalidraw: the app home's link leads to the real site; one case, the
      # first launch only. The site may be slow or change: a failure here is
      # evidence, not a regression gate.
      - name: Real site cases (excalidraw)
        id: w4-excalidraw
        if: ${{ !cancelled() && steps.w4-tls.outcome == 'success' }}
        timeout-minutes: 25
        working-directory: takosumi-mobile
        run: |
          $name = 'sumi-w4-excalidraw'
          $case = Join-Path ([System.IO.Path]::GetTempPath()) $name
          "W4_CASE_EXCALIDRAW=$case" >> $env:GITHUB_ENV
          "W4_APP_DATA_EXCALIDRAW=$env:LOCALAPPDATA\com.takosumi.fixture.browserprocess.$name" >> $env:GITHUB_ENV
          $tls = Join-Path $env:RUNNER_TEMP 'w4-tls'
          $log = Join-Path $env:RUNNER_TEMP 'w4-excalidraw.log'
          $stage = Join-Path $env:RUNNER_TEMP 'w4-stage\cef'
          python -B native-tests/desktop/windows_browser_process.py --binary "$env:CARGO_TARGET_DIR\debug\takosumi-mobile.exe" --browser "$stage\takosumi-cef-browser-process.exe" --guard "$stage\takosumi-browser-guard.exe" --data $case --tls-cert "$tls\cert.pem" --tls-key "$tls\key.pem" --tls-ca "$tls\ca.pem" --real-site excalidraw | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Excalidraw real-site cases failed (exit $LASTEXITCODE)" }
          $excalidrawCases = @(
            'excalidraw/separate-profiles',
            'excalidraw/home-by-window-switch',
            'excalidraw/reuse-raises-window',
            'excalidraw/quit-cancel-stops',
            'excalidraw/quit-partial-order',
            'excalidraw/permission-answered-by-app',
            'excalidraw/quit-completes',
            'excalidraw/no-process-left',
            'excalidraw/no-opener-request'
          )
          foreach ($case_name in $excalidrawCases) {
            if (-not (Select-String -Path $log -Pattern "^PASS case $([regex]::Escape($case_name))$" -Quiet)) { throw "Real-site case $case_name did not pass" }
          }
          $excalidrawCount = @(Select-String -Path $log -Pattern '^PASS case ').Count
          if ($excalidrawCount -ne 9) { throw "Expected exactly 9 Excalidraw cases, saw $excalidrawCount" }
          # Which cancel closed each quit case's beforeunload. One the page or
          # browser made first counts as the cancel (mechanism unknown); it
          # is not a failure, but it is flagged.
          $excalidrawDialogs = @(Select-String -Path $log -Pattern '^DIALOG closedBy=(observer|browser) case=excalidraw/(quit-cancel-stops|quit-partial-order)$')
          if ($excalidrawDialogs.Count -ne 2) { throw "Expected 2 Excalidraw DIALOG lines, saw $($excalidrawDialogs.Count)" }
          foreach ($dialog in $excalidrawDialogs) {
            if ($dialog.Line -match ' closedBy=browser ') { Write-Output "::warning title=Excalidraw beforeunload closed by the page or browser::$($dialog.Line) (counted as the cancel; mechanism unknown)" }
          }
          $summary = Get-Content -Raw (Join-Path $case 'summary.json') | ConvertFrom-Json
          if ($summary.passed -ne $true) { throw 'The Excalidraw summary did not pass' }
      # Photopea: the app home's link leads to the real site; one case, the
      # first launch only. The site may be slow or change: a failure here is
      # evidence, not a regression gate.
      - name: Real site cases (photopea)
        id: w4-photopea
        if: ${{ !cancelled() && steps.w4-tls.outcome == 'success' }}
        timeout-minutes: 25
        working-directory: takosumi-mobile
        run: |
          $name = 'sumi-w4-photopea'
          $case = Join-Path ([System.IO.Path]::GetTempPath()) $name
          "W4_CASE_PHOTOPEA=$case" >> $env:GITHUB_ENV
          "W4_APP_DATA_PHOTOPEA=$env:LOCALAPPDATA\com.takosumi.fixture.browserprocess.$name" >> $env:GITHUB_ENV
          $tls = Join-Path $env:RUNNER_TEMP 'w4-tls'
          $log = Join-Path $env:RUNNER_TEMP 'w4-photopea.log'
          $stage = Join-Path $env:RUNNER_TEMP 'w4-stage\cef'
          python -B native-tests/desktop/windows_browser_process.py --binary "$env:CARGO_TARGET_DIR\debug\takosumi-mobile.exe" --browser "$stage\takosumi-cef-browser-process.exe" --guard "$stage\takosumi-browser-guard.exe" --data $case --tls-cert "$tls\cert.pem" --tls-key "$tls\key.pem" --tls-ca "$tls\ca.pem" --real-site photopea | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Photopea real-site cases failed (exit $LASTEXITCODE)" }
          $photopeaCases = @(
            'photopea/separate-profiles',
            'photopea/home-by-window-switch',
            'photopea/reuse-raises-window',
            'photopea/quit-cancel-stops',
            'photopea/quit-partial-order',
            'photopea/permission-answered-by-app',
            'photopea/quit-completes',
            'photopea/no-process-left',
            'photopea/no-opener-request'
          )
          foreach ($case_name in $photopeaCases) {
            if (-not (Select-String -Path $log -Pattern "^PASS case $([regex]::Escape($case_name))$" -Quiet)) { throw "Real-site case $case_name did not pass" }
          }
          $photopeaCount = @(Select-String -Path $log -Pattern '^PASS case ').Count
          if ($photopeaCount -ne 9) { throw "Expected exactly 9 Photopea cases, saw $photopeaCount" }
          # Which cancel closed each quit case's beforeunload. One the page or
          # browser made first counts as the cancel (mechanism unknown); it
          # is not a failure, but it is flagged.
          $photopeaDialogs = @(Select-String -Path $log -Pattern '^DIALOG closedBy=(observer|browser) case=photopea/(quit-cancel-stops|quit-partial-order)$')
          if ($photopeaDialogs.Count -ne 2) { throw "Expected 2 Photopea DIALOG lines, saw $($photopeaDialogs.Count)" }
          foreach ($dialog in $photopeaDialogs) {
            if ($dialog.Line -match ' closedBy=browser ') { Write-Output "::warning title=Photopea beforeunload closed by the page or browser::$($dialog.Line) (counted as the cancel; mechanism unknown)" }
          }
          $summary = Get-Content -Raw (Join-Path $case 'summary.json') | ConvertFrom-Json
          if ($summary.passed -ne $true) { throw 'The Photopea summary did not pass' }
      - name: Remove the fixture CA
        if: ${{ always() && steps.w4-tls.outcome != 'skipped' }}
        working-directory: takosumi-mobile
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File native-tests/desktop/windows_fixture_tls.ps1 -Out "$env:RUNNER_TEMP\w4-tls" -Remove
          if ($LASTEXITCODE -ne 0) { throw "The fixture CA was not removed (exit $LASTEXITCODE)" }
      # The cases' receipts, markers and logs, and each profile's browser logs.
      - name: Keep the real-site cases
        if: ${{ !cancelled() && (env.W4_CASE_EXCALIDRAW != '' || env.W4_CASE_PHOTOPEA != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-real-sites-cases
          path: |
            ${{ env.W4_CASE_EXCALIDRAW }}
            ${{ env.W4_APP_DATA_EXCALIDRAW }}/browser-process-experiment/*/*.log
            ${{ env.W4_CASE_PHOTOPEA }}
            ${{ env.W4_APP_DATA_PHOTOPEA }}/browser-process-experiment/*/*.log
          if-no-files-found: warn
          retention-days: 14
