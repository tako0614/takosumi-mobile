name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: takosumi-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MOBILE_KIT_SOURCE_REF: 2e1aeff1f88c4370889acb68b99081c32f5a6740
  TAKOSUMI_SOURCE_REF: d6347b169dc04f5036218cfb59a7e91b7d489176

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: takosumi-mobile
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tako0614/mobile-kit
          ref: ${{ env.MOBILE_KIT_SOURCE_REF }}
          path: mobile-kit
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tako0614/takosumi
          ref: ${{ env.TAKOSUMI_SOURCE_REF }}
          path: takosumi
          sparse-checkout: contract
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: takosumi-mobile
      - run: bun run check
        working-directory: takosumi-mobile

  # The native plugin tests `bun run check` does not run: the takosumi-push
  # plugin's RFC 8291 decryption and Declarative Web Push parsing (Kotlin on
  # the plain JVM, with the RFC 8291 Appendix A vector and the shared
  # web-push-cases.json), and the plugins' Rust tests.
  native-plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.14.3"
      - name: Kotlin JVM tests (takosumi-push)
        shell: bash
        run: |
          gradle --project-dir src-tauri/plugins/push/jvm-tests test
          # A task that found no sources (NO-SOURCE) passes silently: require
          # both suites' reports and at least one test.
          results=src-tauri/plugins/push/jvm-tests/build/test-results/test
          for suite in WebPushCryptoTest WebPushCasesTest; do
            test -f "$results/TEST-com.takosumi.push.$suite.xml" || { echo "::error::$suite did not run"; exit 1; }
          done
          total=$(cat "$results"/TEST-*.xml | grep -o '<testsuite [^>]*' | sed -E 's/.* tests="([0-9]+)".*/\1/' | awk '{ sum += $1 } END { print sum + 0 }')
          echo "Kotlin JVM tests run: $total"
          test "$total" -ge 1
      # The iOS plugin's RFC 8291 decryption and Declarative Web Push parsing
      # (TakosumiWebPush.swift) against the same table, with swift-crypto in
      # place of CryptoKit. The image ships Swift; nothing else is installed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/plugins/push/ios/WebPushTests/.build
          key: webpush-swift-${{ runner.os }}-${{ hashFiles('src-tauri/plugins/push/ios/WebPushTests/Package.swift') }}
      - name: Swift tests (takosumi-push)
        shell: bash
        run: |
          swift --version
          swift test --package-path src-tauri/plugins/push/ios/WebPushTests 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          grep -E "Executed [1-9][0-9]* tests?, with 0 failures" "$RUNNER_TEMP/swift-test.log"
      - name: Swift tests (app-screen policy)
        shell: bash
        run: |
          swift test --package-path src-tauri/plugins/app-screen/ios/PolicyTests 2>&1 | tee "$RUNNER_TEMP/app-screen-swift-test.log"
          grep -E "Executed [1-9][0-9]* tests?, with 0 failures" "$RUNNER_TEMP/app-screen-swift-test.log"
      # The image's mirror has crawled for most of the job's budget; bound one
      # attempt, then retry once with archive.ubuntu.com first (the image's
      # mirror list, or plain sources, rewritten only for the retry). The
      # package list is unchanged.
      - name: System libraries for Tauri on Linux
        timeout-minutes: 8
        shell: bash
        run: |
          packages="libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev"
          attempt() {
            # update and install within $1 seconds, apt retrying each download
            options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60"
            timeout --kill-after=15 "$1" sudo bash -c "apt-get $options update && apt-get $options install -y --no-install-recommends $packages"
          }
          if ! attempt 180; then
            switched=""
            # ubuntu-24.04 images point ubuntu.sources at this mirror list
            # (mirror+file:), the Azure mirror first: put archive.ubuntu.com
            # first and drop the Azure entry.
            mirrors=/etc/apt/apt-mirrors.txt
            if [[ -f "$mirrors" ]]; then
              { printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\n'
                grep -v -E '^[^[:space:]]*(azure\.archive|//archive)\.ubuntu\.com' "$mirrors" || true; } > "$RUNNER_TEMP/apt-mirrors.txt"
              sudo cp "$RUNNER_TEMP/apt-mirrors.txt" "$mirrors"
              switched="$mirrors"
            fi
            # Sources that name an archive.ubuntu.com mirror directly.
            for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
              if [[ -f "$sources" ]] && grep -q -E 'https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu' "$sources"; then
                sudo sed -i -E 's#https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' "$sources"
                switched="$switched $sources"
              fi
            done
            if [[ -n "$switched" ]]; then
              echo "::warning::apt-get failed or took over 180 s; retrying once with archive.ubuntu.com first in:$switched"
            else
              echo "::warning::apt-get failed or took over 180 s; no mirror list or archive.ubuntu.com source to switch, retrying once unchanged"
            fi
            # An attempt ended during unpacking leaves dpkg to finish first,
            # once its lock is free (at most 60 s; a lock still held then makes
            # dpkg fail the step visibly).
            if command -v fuser > /dev/null; then
              for _ in $(seq 60); do
                sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock > /dev/null 2>&1 || break
                sleep 1
              done
            else
              echo "::warning::fuser is unavailable; dpkg's lock is not awaited"
            fi
            sudo dpkg --configure -a
            attempt 180
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target-plugins
          key: native-plugins-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/plugins/*/Cargo.toml') }}
          restore-keys: native-plugins-cargo-${{ runner.os }}-
      - name: cargo test (takosumi-push, app-screen)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-plugins
        # The plugins have no lockfile of their own; the app's pins the same
        # versions the app builds with.
        run: |
          for plugin in push app-screen; do
            cp src-tauri/Cargo.lock "src-tauri/plugins/$plugin/Cargo.lock"
            cargo test --manifest-path "src-tauri/plugins/$plugin/Cargo.toml"
          done
      - name: Android app-screen JVM and instrumentation compile
        shell: bash
        run: |
          export TAURI_ANDROID_SOURCE="$(cargo metadata --format-version 1 --locked --manifest-path src-tauri/plugins/app-screen/Cargo.toml | python3 -c 'import json,sys,pathlib; data=json.load(sys.stdin); print(next(pathlib.Path(p["manifest_path"]).parent / "mobile/android" for p in data["packages"] if p["name"]=="tauri"))')"
          echo "TAURI_ANDROID_SOURCE=$TAURI_ANDROID_SOURCE" >> "$GITHUB_ENV"
          gradle --project-dir native-tests/android :app-screen:testDebugUnitTest :app-screen:assembleDebugAndroidTest
      - name: Actual WebView profile isolation on Android emulator
        timeout-minutes: 10
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # The API35 image's WebView124 supports profiles but not the required
          # DELETE_BROWSING_DATA API. Qualify a newer official engine; keep the
          # instrumentation capability assertions and zero-skip checks below.
          sdkmanager "system-images;android-36;google_apis;x86_64"
          cat "$ANDROID_HOME/system-images/android-36/google_apis/x86_64/source.properties"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/sumi-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name sumi-profiles --package "system-images;android-36;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -list-avds
          df -h "$ANDROID_HOME" "$RUNNER_TEMP"
          "$ANDROID_HOME/emulator/emulator" -avd sumi-profiles -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -wipe-data > "$RUNNER_TEMP/sumi-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            result=$?
            if [[ "$result" != "0" ]]; then
              cat "$RUNNER_TEMP/sumi-emulator.log"
              adb devices -l || true
            fi
            kill "$emulator_pid" 2>/dev/null || true
            return "$result"
          }
          trap cleanup EXIT
          timeout 180 adb wait-for-device
          booted=0
          for attempt in {1..90}; do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then booted=1; break; fi
            sleep 2
          done
          if [[ "$booted" != "1" ]]; then cat "$RUNNER_TEMP/sumi-emulator.log"; exit 1; fi
          adb shell input keyevent 82
          adb shell getprop ro.build.version.sdk
          adb shell dumpsys webviewupdate
          gradle --project-dir native-tests/android :app-screen:connectedDebugAndroidTest
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as E
          reports = list(pathlib.Path('src-tauri/plugins/app-screen/android/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
          assert reports, 'No actual Android instrumentation reports'
          tests = failures = skipped = 0
          actual_cases = set()
          for report in reports:
              root = E.parse(report).getroot()
              tests += int(root.get('tests', 0))
              failures += int(root.get('failures', 0)) + int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
              actual_cases.update((case.get('classname'), case.get('name')) for case in root.iter('testcase'))
          print(f'Actual WebView tests: {tests}, failures/errors: {failures}, skipped: {skipped}')
          required = {
              ('com.takosumi.appscreen.ProfileIsolationTest', 'clearingAnIdleProfileWaitsForCompletionAndPreservesOtherProfiles'),
              ('com.takosumi.appscreen.ProfileResetActivityTest', 'completedResetDropsAnEvictedActivityUrlAndPreResetSavedState'),
          }
          assert required <= actual_cases, f'Missing actual profile reset controls: {required - actual_cases}'
          assert tests >= 4 and failures == 0 and skipped == 0
          PY

  desktop:
    needs: [quality, native-plugins]
    # Wait for native checks, but collect independent OS evidence even if an
    # Android SDK download/test fails. The failed native job remains red.
    if: ${{ !cancelled() && needs.quality.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Hosted arm64 acquisition failed before SDK execution; use the
        # standard Intel image for this compile lane, keeping all OS targets.
        os: [ubuntu-24.04, macos-26-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: takosumi-mobile
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tako0614/mobile-kit
          ref: ${{ env.MOBILE_KIT_SOURCE_REF }}
          path: mobile-kit
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tako0614/takosumi
          ref: ${{ env.TAKOSUMI_SOURCE_REF }}
          path: takosumi
          sparse-checkout: contract
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: takosumi-mobile
      - run: bun run build
        working-directory: takosumi-mobile
      # The image's mirror has crawled for most of the job's budget; bound one
      # attempt, then retry once with archive.ubuntu.com first (the image's
      # mirror list, or plain sources, rewritten only for the retry). The
      # package list is unchanged.
      - name: Linux desktop SDK and isolated test tools
        if: runner.os == 'Linux'
        timeout-minutes: 8
        shell: bash
        run: |
          packages="libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev xvfb xdotool dbus-x11"
          attempt() {
            # update and install within $1 seconds, apt retrying each download
            options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60"
            timeout --kill-after=15 "$1" sudo bash -c "apt-get $options update && apt-get $options install -y --no-install-recommends $packages"
          }
          if ! attempt 180; then
            switched=""
            # ubuntu-24.04 images point ubuntu.sources at this mirror list
            # (mirror+file:), the Azure mirror first: put archive.ubuntu.com
            # first and drop the Azure entry.
            mirrors=/etc/apt/apt-mirrors.txt
            if [[ -f "$mirrors" ]]; then
              { printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\n'
                grep -v -E '^[^[:space:]]*(azure\.archive|//archive)\.ubuntu\.com' "$mirrors" || true; } > "$RUNNER_TEMP/apt-mirrors.txt"
              sudo cp "$RUNNER_TEMP/apt-mirrors.txt" "$mirrors"
              switched="$mirrors"
            fi
            # Sources that name an archive.ubuntu.com mirror directly.
            for sources in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
              if [[ -f "$sources" ]] && grep -q -E 'https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu' "$sources"; then
                sudo sed -i -E 's#https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' "$sources"
                switched="$switched $sources"
              fi
            done
            if [[ -n "$switched" ]]; then
              echo "::warning::apt-get failed or took over 180 s; retrying once with archive.ubuntu.com first in:$switched"
            else
              echo "::warning::apt-get failed or took over 180 s; no mirror list or archive.ubuntu.com source to switch, retrying once unchanged"
            fi
            # An attempt ended during unpacking leaves dpkg to finish first,
            # once its lock is free (at most 60 s; a lock still held then makes
            # dpkg fail the step visibly).
            if command -v fuser > /dev/null; then
              for _ in $(seq 60); do
                sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock > /dev/null 2>&1 || break
                sleep 1
              done
            else
              echo "::warning::fuser is unavailable; dpkg's lock is not awaited"
            fi
            sudo dpkg --configure -a
            attempt 180
          fi
      - name: Shared Web-home confirmation in isolated Chromium
        if: runner.os == 'Linux'
        timeout-minutes: 2
        working-directory: takosumi-mobile
        run: |
          node --version
          export CHROME_BIN="$(command -v google-chrome)"
          "$CHROME_BIN" --version
          PYTHONDONTWRITEBYTECODE=1 python3 native-tests/browser/test_guard.py
          bunx tsc --noEmit -p native-tests/browser/tsconfig.json
          PYTHONDONTWRITEBYTECODE=1 node --experimental-strip-types native-tests/browser/run.ts "$RUNNER_TEMP/takosumi-webhome-ui"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: desktop-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            takosumi-mobile/src-tauri/target
          key: desktop-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('takosumi-mobile/src-tauri/Cargo.lock') }}
      - name: Compile desktop App and platform adapters
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
        working-directory: takosumi-mobile
      # The per-profile CEF adapter also compiles on Windows (an unsandboxed
      # test candidate there; the cef-windows job runs it).
      - name: Compile desktop App with the per-profile CEF adapter
        if: runner.os == 'Windows'
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --features desktop-cef
        working-directory: takosumi-mobile
      - name: Whole App iOS Simulator SDK build (unsigned)
        if: runner.os == 'macOS'
        timeout-minutes: 25
        env:
          CARGO_BUILD_JOBS: "2"
        run: bash native-tests/ios/build-simulator.sh
        working-directory: takosumi-mobile
      - name: Actual GTK profile, navigation and popup fixture
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_TARGET_DIR: ${{ github.workspace }}/takosumi-mobile/src-tauri/target
          TAKOSUMI_FIXTURE_DATA: ${{ runner.temp }}/takosumi-desktop-profile-fixture
        working-directory: takosumi-mobile
        run: |
          cp src-tauri/Cargo.lock src-tauri/plugins/app-screen/Cargo.lock
          cargo build --manifest-path src-tauri/plugins/app-screen/Cargo.toml --features desktop-fixture --example desktop-profile-probe
          cargo test --locked --manifest-path src-tauri/plugins/app-screen/Cargo.toml --features desktop --lib --test capabilities
          python3 -B native-tests/desktop/test_run.py
          python3 native-tests/desktop/run.py --binary "$CARGO_TARGET_DIR/debug/examples/desktop-profile-probe" --data "$TAKOSUMI_FIXTURE_DATA"
          python3 native-tests/desktop/run.py --profile-reset --binary "$CARGO_TARGET_DIR/debug/examples/desktop-profile-probe" --data "$TAKOSUMI_FIXTURE_DATA-reset"
          python3 native-tests/desktop/run.py --spa-resume --binary "$CARGO_TARGET_DIR/debug/examples/desktop-profile-probe" --data "$TAKOSUMI_FIXTURE_DATA-spa"
          python3 native-tests/desktop/run.py --spa-resume --failed-navigation --binary "$CARGO_TARGET_DIR/debug/examples/desktop-profile-probe" --data "$TAKOSUMI_FIXTURE_DATA-failure"
          python3 native-tests/desktop/run.py --spa-resume --failed-navigation --error-page-close --binary "$CARGO_TARGET_DIR/debug/examples/desktop-profile-probe" --data "$TAKOSUMI_FIXTURE_DATA-error-page"
          python3 native-tests/desktop/run.py --spa-resume --failed-navigation --error-page-close --error-page-back --binary "$CARGO_TARGET_DIR/debug/examples/desktop-profile-probe" --data "$TAKOSUMI_FIXTURE_DATA-error-back"
          python3 native-tests/desktop/run.py --spa-resume --failed-navigation --error-page-close --error-page-retry --binary "$CARGO_TARGET_DIR/debug/examples/desktop-profile-probe" --data "$TAKOSUMI_FIXTURE_DATA-error-retry"
          python3 native-tests/desktop/run.py --spa-resume --cancelled-navigation --binary "$CARGO_TARGET_DIR/debug/examples/desktop-profile-probe" --data "$TAKOSUMI_FIXTURE_DATA-cancelled"
          python3 native-tests/desktop/run.py --spa-resume --cancelled-navigation --cancelled-spa --binary "$CARGO_TARGET_DIR/debug/examples/desktop-profile-probe" --data "$TAKOSUMI_FIXTURE_DATA-cancelled-spa"
          python3 native-tests/desktop/run.py --spa-resume --pending-navigation --binary "$CARGO_TARGET_DIR/debug/examples/desktop-profile-probe" --data "$TAKOSUMI_FIXTURE_DATA-pending"
      # The browser-process actual-App fixture's GTK driver (shared with the
      # Windows one) is run locally against real sites, not here; compile it
      # so a change to the shared flow cannot break the Linux build unseen.
      - name: Compile the browser-process App fixture (Linux GTK driver)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --features native-browser-process-fixture
        working-directory: takosumi-mobile
      - name: Build bundled App and verify the fixture observer
        id: linux-app-fixture-build
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
        working-directory: takosumi-mobile
        run: |
          python3 native-tests/desktop/test_web_home.py
          cargo build --locked --manifest-path src-tauri/Cargo.toml --features native-web-home-fixture
      - name: Actual bundled App shared-UI profile reset
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.linux-app-fixture-build.outcome == 'success' }}
        shell: bash
        working-directory: takosumi-mobile
        run: python3 native-tests/desktop/web_home.py --profile-reset --binary src-tauri/target/debug/takosumi-mobile --data "$RUNNER_TEMP/takosumi-full-profile-reset"
      - name: Actual bundled App restart after profile reset
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.linux-app-fixture-build.outcome == 'success' }}
        shell: bash
        working-directory: takosumi-mobile
        run: python3 native-tests/desktop/web_home.py --reset-restart --binary src-tauri/target/debug/takosumi-mobile --data "$RUNNER_TEMP/takosumi-reset-restart"
      - name: Actual bundled App connection, mock login and home flow
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.linux-app-fixture-build.outcome == 'success' }}
        shell: bash
        working-directory: takosumi-mobile
        run: |
          python3 native-tests/desktop/web_home.py --binary src-tauri/target/debug/takosumi-mobile --data "$RUNNER_TEMP/takosumi-full-web-home"
          python3 native-tests/desktop/web_home.py --quick-close --binary src-tauri/target/debug/takosumi-mobile --data "$RUNNER_TEMP/takosumi-quick-close"
          python3 native-tests/desktop/web_home.py --legacy-entry --quick-close --binary src-tauri/target/debug/takosumi-mobile --data "$RUNNER_TEMP/takosumi-legacy-return"
      # Preserve compiler work after a diagnosed SDK failure. A cancelled job
      # may still have writers, and a cache is never an acceptance receipt.
      - name: Preserve desktop compiler cache
        if: ${{ !cancelled() && steps.desktop-cache.outputs.cache-hit != 'true' && steps.desktop-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            takosumi-mobile/src-tauri/target
          key: ${{ steps.desktop-cache.outputs.cache-primary-key }}

  # The per-profile CEF browser on Windows (first candidate): build
  # takosumi-cef-browser-process and takosumi-browser-guard from
  # native-tests/cef-candidate with their locked crates, run the browser alone
  # through windows_smoke.py, run the guard's self-tests, then drive both
  # through the App's adapter (its Process API, no App UI) in the app-screen
  # plugin's Windows tests. The browser runs without Chromium's sandbox on
  # Windows, which the build must ask for by name
  # (windows-unsandboxed-candidate); it is a test candidate, not a package.
  # The standalone candidate is Linux only and is not built. Independent of
  # the other jobs.
  cef-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target-cef
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Locked CEF version
        id: cef
        shell: pwsh
        run: |
          $lock = Get-Content native-tests/cef-candidate/Cargo.lock
          $index = [array]::IndexOf($lock, 'name = "cef-dll-sys"')
          if ($index -lt 0 -or $lock[$index + 1] -notmatch '^version = "(.+)"$') { throw 'cef-dll-sys is not locked' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      # cef-dll-sys downloads the CEF distribution into CEF_PATH on its first
      # build. Cache the extracted distribution, not the archive beside it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cef-sdk
        with:
          path: |
            ${{ runner.temp }}/cef
            !${{ runner.temp }}/cef/*/*.tar.bz2
          key: cef-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cef-cargo
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target-cef
          # crt: built with the static C runtime since W6 (a new key, so the
          # cache is saved once with it).
          key: cef-windows-cargo-crt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native-tests/cef-candidate/Cargo.lock') }}
          restore-keys: |
            cef-windows-cargo-crt-${{ runner.os }}-${{ runner.arch }}-
            cef-windows-cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: CMake and Ninja for the CEF wrapper
        shell: pwsh
        run: |
          cmake --version
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            # Visual Studio ships Ninja with its CMake tools.
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
            $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
            if (-not (Test-Path (Join-Path $ninja 'ninja.exe'))) { throw 'Ninja is not available' }
            Add-Content -Path $env:GITHUB_PATH -Value $ninja
            & (Join-Path $ninja 'ninja.exe') --version
          } else {
            ninja --version
          }
          rustc --version
          cargo --version
          python --version
      # From native-tests/cef-candidate, whose .cargo/config.toml links the
      # C runtime statically (no VCRUNTIME140.dll needed on a clean Windows).
      - name: Build takosumi-cef-browser-process (product, unsandboxed candidate) and takosumi-browser-guard
        id: build
        working-directory: native-tests/cef-candidate
        env:
          CEF_PATH: ${{ runner.temp }}\cef
        run: cargo build --locked --features windows-unsandboxed-candidate --bin takosumi-cef-browser-process --bin takosumi-browser-guard
      # Keep the SDK and the compiler work even when a smoke run below fails.
      - name: Preserve CEF distribution
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cef-sdk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cef
            !${{ runner.temp }}/cef/*/*.tar.bz2
          key: ${{ steps.cef-sdk.outputs.cache-primary-key }}
      - name: Preserve CEF compiler cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cef-cargo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target-cef
          key: ${{ steps.cef-cargo.outputs.cache-primary-key }}
      # build.rs embeds the application manifest with MSVC linker flags; read
      # the RT_MANIFEST resource back from the executable with the SDK's mt.exe.
      - name: Embedded application manifest
        shell: pwsh
        run: |
          $exe = "$env:CARGO_TARGET_DIR\debug\takosumi-cef-browser-process.exe"
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'mt.exe from the Windows SDK is not available' }
          $out = Join-Path $env:RUNNER_TEMP 'takosumi-cef-browser-process.manifest'
          & $mt.FullName -nologo "-inputresource:$exe;#1" "-out:$out"
          if ($LASTEXITCODE -ne 0) { throw "No embedded manifest (mt.exe exit $LASTEXITCODE)" }
          Get-Content -Raw $out
          [xml]$manifest = Get-Content -Raw $out
          $os = @($manifest.SelectNodes("//*[local-name()='supportedOS']") | ForEach-Object { $_.GetAttribute('Id') })
          if (($os -join ',') -ne '{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}') { throw "Unexpected supportedOS: $($os -join ',')" }
          $controls = @($manifest.SelectNodes("//*[local-name()='assemblyIdentity' and @name='Microsoft.Windows.Common-Controls' and @version='6.0.0.0']"))
          if ($controls.Count -ne 1) { throw 'No Common Controls 6 dependency' }
          $levels = @($manifest.SelectNodes("//*[local-name()='requestedExecutionLevel']") | ForEach-Object { $_.GetAttribute('level') })
          if (($levels -join ',') -ne 'asInvoker') { throw "Unexpected requestedExecutionLevel: $($levels -join ',')" }
      # cef-dll-sys copies libcef.dll and the CEF resources beside the
      # executable, where Windows looks first.
      - name: Browser smoke (product build)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: python -B native-tests/cef-candidate/windows_smoke.py --browser "$env:CARGO_TARGET_DIR\debug\takosumi-cef-browser-process.exe" --work "$env:RUNNER_TEMP"
      # The Windows guard (Job Objects) with stand-in browsers: the self-test
      # binary re-executes itself as the guard and as the browser. A selection
      # that runs fewer than all thirteen cases fails.
      - name: Guard self-tests (Windows)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        working-directory: native-tests/cef-candidate
        env:
          CEF_PATH: ${{ runner.temp }}\cef
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'guard-self-tests.log'
          cargo test --locked --features windows-unsandboxed-candidate --bin takosumi-browser-guard | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Guard self-tests failed (exit $LASTEXITCODE)" }
          if (-not (Select-String -Path $log -Pattern '^test result: ok\. 13 passed; 0 failed$' -Quiet)) { throw 'Not all thirteen guard self-tests ran' }
      # The App's adapter on Windows with the product browser and the guard
      # built above: the plugin's Windows unit tests, then the two ignored
      # tests that start a profile through Process::spawn and the creation
      # reply check, reopen it, shut it down through the adapter and require a
      # normal guard receipt, and end the App's Job Object to require that the
      # guard and every browser process end with it. Every one must have run.
      - name: App adapter with the built guard and browser (Process API)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          $env:TAKOSUMI_WINDOWS_GUARD = "$env:CARGO_TARGET_DIR\debug\takosumi-browser-guard.exe"
          $env:TAKOSUMI_WINDOWS_BROWSER = "$env:CARGO_TARGET_DIR\debug\takosumi-cef-browser-process.exe"
          # The plugin has no lockfile of its own; the app's pins its versions.
          Copy-Item src-tauri/Cargo.lock src-tauri/plugins/app-screen/Cargo.lock
          # The copied lock also lists crates the plugin's graph does not use,
          # and --locked refuses to prune them: one unlocked resolve does.
          cargo metadata --format-version 1 --manifest-path src-tauri/plugins/app-screen/Cargo.toml > $null
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed (exit $LASTEXITCODE)" }
          # It may only prune: every [[package]] name and version left in the
          # plugin lock must be one the app's lock pins.
          function Get-LockedPackages([string]$path) {
            $found = [System.Collections.Generic.HashSet[string]]::new()
            $package = $false
            $name = $null
            foreach ($line in Get-Content -LiteralPath $path) {
              if ($line.StartsWith('[')) { $package = ($line -eq '[[package]]'); $name = $null; continue }
              if (-not $package) { continue }
              if ($line -match '^name = "(.+)"$') { $name = $Matches[1] }
              elseif ($null -ne $name -and $line -match '^version = "(.+)"$') { [void]$found.Add("$name $($Matches[1])"); $name = $null }
            }
            return ,$found
          }
          $app = Get-LockedPackages src-tauri/Cargo.lock
          $plugin = Get-LockedPackages src-tauri/plugins/app-screen/Cargo.lock
          if ($plugin.Count -eq 0) { throw 'The plugin lock lists no packages' }
          $added = @($plugin | Where-Object { -not $app.Contains($_) } | Sort-Object)
          if ($added.Count -gt 0) { throw "The plugin lock pins versions the app's lock does not: $($added -join ', ')" }
          Write-Output "Plugin lock: $($plugin.Count) of the app's $($app.Count) pinned packages"
          $log = Join-Path $env:RUNNER_TEMP 'adapter-tests.log'
          cargo test --locked --manifest-path src-tauri/plugins/app-screen/Cargo.toml --features desktop-process-experiment --lib -- windows_tests --include-ignored --test-threads 1 --show-output | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Adapter tests failed (exit $LASTEXITCODE)" }
          $required = @(
            'desktop::process_adapter::windows_tests::windows_adapter_opens_reuses_and_shuts_down_a_profile',
            'desktop::process_adapter::windows_tests::windows_adapter_ending_the_app_job_ends_guard_and_browser',
            'desktop::process_adapter::windows_tests::a_write_the_browser_does_not_read_times_out_and_holds_the_next',
            'desktop::process_adapter::windows_tests::dropping_the_writer_during_a_blocked_write_closes_the_pipe',
            'desktop::process_windows::windows_tests::a_partly_written_request_is_not_continued_once_closing',
            'desktop::process_adapter::windows_tests::a_held_chromium_lockfile_refuses_the_clear_and_keeps_the_data',
            'desktop::process_adapter::windows_tests::an_unresolvable_browser_leaves_the_app_running_with_its_reason',
            'desktop::process_setup::windows::windows_tests::a_held_runtime_lock_is_never_judged_stale_and_its_directory_can_go',
            'desktop::process_setup::windows::windows_tests::a_missing_cache_runtime_root_is_created_and_located',
            'desktop::process_setup::windows::windows_tests::bundled_executables_must_be_plain_files_in_the_installation'
          )
          foreach ($name in $required) {
            if (-not (Select-String -Path $log -SimpleMatch "test $name ... ok" -Quiet)) { throw "$name did not pass" }
          }
          if (-not (Select-String -Path $log -Pattern '^test result: ok\. 14 passed; 0 failed; 0 ignored' -Quiet)) { throw 'Not all fourteen Windows adapter tests ran' }
      # The fixture-inspection build adds the main-frame load marker, which
      # shows a renderer ran; --reuse reopens the screen and requires the Win32
      # raise to make its top-level window the foreground window.
      - name: Build takosumi-cef-browser-process (fixture-inspection, unsandboxed candidate)
        id: fixture-build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: native-tests/cef-candidate
        env:
          CEF_PATH: ${{ runner.temp }}\cef
        run: cargo build --locked --features fixture-inspection,windows-unsandboxed-candidate --bin takosumi-cef-browser-process
      - name: Browser smoke (page load and window reuse)
        if: ${{ !cancelled() && steps.fixture-build.outcome == 'success' }}
        timeout-minutes: 15
        run: python -B native-tests/cef-candidate/windows_smoke.py --browser "$env:CARGO_TARGET_DIR\debug\takosumi-cef-browser-process.exe" --work "$env:RUNNER_TEMP" --expect-load --reuse

  # The actual App on Windows (W3): the real home in WebView2 drives the
  # per-profile CEF browser through the App's own adapter, as the Linux
  # actual-App fixture does. It builds the fixture-inspection browser and the
  # guard (the unsandboxed candidate) and the App with
  # native-browser-process-fixture, then windows_browser_process.py runs one
  # case in three launches (first, restart, reset) against its local HTTPS
  # fixture site. The site's disposable CA is trusted on the runner only for
  # this run. Real sites run on Windows only in the manual evidence workflow
  # windows-real-sites.yml (W4), never here. Independent of the other jobs.
  cef-windows-app:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target-w3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: takosumi-mobile
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tako0614/mobile-kit
          ref: ${{ env.MOBILE_KIT_SOURCE_REF }}
          path: mobile-kit
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tako0614/takosumi
          ref: ${{ env.TAKOSUMI_SOURCE_REF }}
          path: takosumi
          sparse-checkout: contract
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: takosumi-mobile
      # The App bundles the built home (tauri/custom-protocol).
      - run: bun run build
        working-directory: takosumi-mobile
      - name: W3 runner unit tests
        working-directory: takosumi-mobile
        run: |
          python -B native-tests/desktop/test_windows_browser_process.py -v
          if ($LASTEXITCODE -ne 0) { throw "W3 runner unit tests failed (exit $LASTEXITCODE)" }
      # Tauri's home needs the Evergreen WebView2 Runtime; name it, or stop
      # here with that reason instead of a failed App start.
      - name: WebView2 Runtime
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $versions = foreach ($key in @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKLM:\SOFTWARE\$client", "HKCU:\Software\$client")) {
            (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
          }
          $version = @($versions | Where-Object { $_ -and $_ -ne '0.0.0.0' }) | Select-Object -First 1
          if (-not $version) { throw 'The WebView2 Runtime is not installed on this runner' }
          "WebView2 Runtime $version"
      - name: Locked CEF version
        id: cef
        shell: pwsh
        working-directory: takosumi-mobile
        run: |
          $lock = Get-Content native-tests/cef-candidate/Cargo.lock
          $index = [array]::IndexOf($lock, 'name = "cef-dll-sys"')
          if ($index -lt 0 -or $lock[$index + 1] -notmatch '^version = "(.+)"$') { throw 'cef-dll-sys is not locked' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      # The cef-windows job's CEF distribution cache (same key).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cef-sdk
        with:
          path: |
            ${{ runner.temp }}/cef
            !${{ runner.temp }}/cef/*/*.tar.bz2
          key: cef-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: w3-cargo
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target-w3
          key: cef-windows-app-cargo-crt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('takosumi-mobile/native-tests/cef-candidate/Cargo.lock', 'takosumi-mobile/src-tauri/Cargo.lock') }}
          restore-keys: |
            cef-windows-app-cargo-crt-${{ runner.os }}-${{ runner.arch }}-
            cef-windows-app-cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: CMake and Ninja for the CEF wrapper
        shell: pwsh
        run: |
          cmake --version
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            # Visual Studio ships Ninja with its CMake tools.
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
            $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
            if (-not (Test-Path (Join-Path $ninja 'ninja.exe'))) { throw 'Ninja is not available' }
            Add-Content -Path $env:GITHUB_PATH -Value $ninja
            & (Join-Path $ninja 'ninja.exe') --version
          } else {
            ninja --version
          }
          rustc --version
          cargo --version
          python --version
      # From native-tests/cef-candidate (static C runtime, .cargo/config.toml).
      - name: Build takosumi-cef-browser-process (fixture-inspection, unsandboxed candidate) and takosumi-browser-guard
        id: browser-build
        working-directory: takosumi-mobile/native-tests/cef-candidate
        env:
          CEF_PATH: ${{ runner.temp }}\cef
        run: cargo build --locked --features fixture-inspection,windows-unsandboxed-candidate --bin takosumi-cef-browser-process --bin takosumi-browser-guard
      # Line tables keep panics' locations while the App's debug build (and
      # its cache) stays small.
      - name: Build the App with native-browser-process-fixture
        id: app-build
        working-directory: takosumi-mobile
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features native-browser-process-fixture
      - name: Preserve CEF distribution
        if: ${{ !cancelled() && steps.browser-build.outcome == 'success' && steps.cef-sdk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cef
            !${{ runner.temp }}/cef/*/*.tar.bz2
          key: ${{ steps.cef-sdk.outputs.cache-primary-key }}
      - name: Preserve W3 compiler cache
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' && steps.w3-cargo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target-w3
          key: ${{ steps.w3-cargo.outputs.cache-primary-key }}
      - name: Fixture site TLS (disposable CA trusted for this run)
        id: w3-tls
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' }}
        working-directory: takosumi-mobile
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File native-tests/desktop/windows_fixture_tls.ps1 -Out "$env:RUNNER_TEMP\w3-tls"
          if ($LASTEXITCODE -ne 0) { throw "The fixture TLS setup failed (exit $LASTEXITCODE)" }
      # One case, three launches of the App on its data (first, restart,
      # reset). Every required case must pass and exactly these ten run.
      - name: Actual App cases (home, per-profile CEF, reuse, quit, restart, clear)
        id: w3-run
        if: ${{ !cancelled() && steps.w3-tls.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: takosumi-mobile
        run: |
          # The App's browser runtime root must lie in the user's profile, so
          # the case is in the user's temp directory, not RUNNER_TEMP. Its
          # short name also names the App's data (a fresh runner each run).
          $name = 'sumi-w3'
          $case = Join-Path ([System.IO.Path]::GetTempPath()) $name
          "W3_CASE=$case" >> $env:GITHUB_ENV
          "W3_APP_DATA=$env:LOCALAPPDATA\com.takosumi.fixture.browserprocess.$name" >> $env:GITHUB_ENV
          $tls = Join-Path $env:RUNNER_TEMP 'w3-tls'
          $log = Join-Path $env:RUNNER_TEMP 'w3-cases.log'
          python -B native-tests/desktop/windows_browser_process.py --binary "$env:CARGO_TARGET_DIR\debug\takosumi-mobile.exe" --browser "$env:CARGO_TARGET_DIR\debug\takosumi-cef-browser-process.exe" --guard "$env:CARGO_TARGET_DIR\debug\takosumi-browser-guard.exe" --data $case --tls-cert "$tls\cert.pem" --tls-key "$tls\key.pem" --tls-ca "$tls\ca.pem" --restart --reset | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "W3 actual App cases failed (exit $LASTEXITCODE)" }
          $w3Cases = @(
            'separate-profiles',
            'home-by-window-switch',
            'reuse-raises-window',
            'quit-cancel-stops',
            'quit-partial-order',
            'quit-completes',
            'restart-keeps-separation',
            'clear-only-one-profile',
            'no-process-left',
            'no-opener-request'
          )
          foreach ($case_name in $w3Cases) {
            if (-not (Select-String -Path $log -Pattern "^PASS case $([regex]::Escape($case_name))$" -Quiet)) { throw "W3 case $case_name did not pass" }
          }
          $w3Count = @(Select-String -Path $log -Pattern '^PASS case ').Count
          if ($w3Count -ne 10) { throw "Expected exactly ten W3 cases, saw $w3Count" }
          $summary = Get-Content -Raw (Join-Path $case 'summary.json') | ConvertFrom-Json
          if ($summary.passed -ne $true) { throw 'The W3 summary did not pass' }
      - name: Remove the fixture CA
        if: ${{ always() && steps.w3-tls.outcome != 'skipped' }}
        working-directory: takosumi-mobile
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File native-tests/desktop/windows_fixture_tls.ps1 -Out "$env:RUNNER_TEMP\w3-tls" -Remove
          if ($LASTEXITCODE -ne 0) { throw "The fixture CA was not removed (exit $LASTEXITCODE)" }
      # The case's receipts, markers and logs, and each profile's browser logs.
      - name: Keep the W3 case
        if: ${{ !cancelled() && env.W3_CASE != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cef-windows-app-case
          path: |
            ${{ env.W3_CASE }}
            ${{ env.W3_APP_DATA }}/browser-process-experiment/*/*.log
          if-no-files-found: warn
          retention-days: 14

  # W6, the Windows counterpart of the Linux product path (#28), unsigned and
  # unpublished: the CEF runtime, the browser and the Rust guard are staged
  # (scripts/stage-windows-cef.mjs) into an NSIS bundle's cef/, the App
  # resolves them there without environment variables, and the installer
  # installs per user. A fixture installer (tauri.windows-cef-fixture.conf.json)
  # is installed silently and the W3 cases run against the installed App
  # (--packaged); the product installer (tauri.windows-cef.conf.json) is
  # installed, its browser run alone (windows_smoke.py) and the installed App
  # launched once (window, a few seconds up, no unavailable browser, WM_CLOSE,
  # empty job). Each is then uninstalled silently. The browser stays the unsandboxed candidate. No installer or
  # binary is uploaded: logs, reports, stage manifests and the case only.
  # Independent of the other jobs.
  cef-windows-package:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # The W3 job's compiler cache (restored, never saved here).
      CARGO_TARGET_DIR: ${{ github.workspace }}\target-w3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: takosumi-mobile
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tako0614/mobile-kit
          ref: ${{ env.MOBILE_KIT_SOURCE_REF }}
          path: mobile-kit
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tako0614/takosumi
          ref: ${{ env.TAKOSUMI_SOURCE_REF }}
          path: takosumi
          sparse-checkout: contract
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: takosumi-mobile
      - name: W6 runner unit tests
        working-directory: takosumi-mobile
        run: |
          python -B native-tests/desktop/test_windows_browser_process.py -v
          if ($LASTEXITCODE -ne 0) { throw "W3 runner unit tests failed (exit $LASTEXITCODE)" }
          python -B native-tests/desktop/test_windows_package.py -v
          if ($LASTEXITCODE -ne 0) { throw "Package check unit tests failed (exit $LASTEXITCODE)" }
      - name: WebView2 Runtime
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $versions = foreach ($key in @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKLM:\SOFTWARE\$client", "HKCU:\Software\$client")) {
            (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
          }
          $version = @($versions | Where-Object { $_ -and $_ -ne '0.0.0.0' }) | Select-Object -First 1
          if (-not $version) { throw 'The WebView2 Runtime is not installed on this runner' }
          "WebView2 Runtime $version"
      - name: Locked CEF version
        id: cef
        shell: pwsh
        working-directory: takosumi-mobile
        run: |
          $lock = Get-Content native-tests/cef-candidate/Cargo.lock
          $index = [array]::IndexOf($lock, 'name = "cef-dll-sys"')
          if ($index -lt 0 -or $lock[$index + 1] -notmatch '^version = "(.+)"$') { throw 'cef-dll-sys is not locked' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cef
            !${{ runner.temp }}/cef/*/*.tar.bz2
          key: cef-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target-w3
          key: cef-windows-app-cargo-crt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('takosumi-mobile/native-tests/cef-candidate/Cargo.lock', 'takosumi-mobile/src-tauri/Cargo.lock') }}
          restore-keys: |
            cef-windows-app-cargo-crt-${{ runner.os }}-${{ runner.arch }}-
            cef-windows-app-cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: CMake and Ninja for the CEF wrapper
        shell: pwsh
        run: |
          cmake --version
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            # Visual Studio ships Ninja with its CMake tools.
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
            $ninja = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
            if (-not (Test-Path (Join-Path $ninja 'ninja.exe'))) { throw 'Ninja is not available' }
            Add-Content -Path $env:GITHUB_PATH -Value $ninja
            & (Join-Path $ninja 'ninja.exe') --version
          } else {
            ninja --version
          }
          rustc --version
          cargo --version
          python --version
          node --version
      # The product browser (no inspection seam) and the guard, staged first:
      # the fixture build below replaces the browser in the build directory.
      - name: Build and stage the product browser and guard
        id: product-stage
        working-directory: takosumi-mobile
        env:
          CEF_PATH: ${{ runner.temp }}\cef
        run: |
          # From native-tests/cef-candidate (static C runtime, .cargo/config.toml).
          Push-Location native-tests/cef-candidate
          cargo build --locked --features windows-unsandboxed-candidate --bin takosumi-cef-browser-process --bin takosumi-browser-guard
          $built = $LASTEXITCODE
          Pop-Location
          if ($built -ne 0) { throw "The product browser build failed (exit $built)" }
          $cef = @(Get-ChildItem -Path $env:CEF_PATH -Directory -Recurse -Depth 1 -Filter cef_windows_x86_64)
          if ($cef.Count -ne 1) { throw "Expected one CEF distribution under $env:CEF_PATH, found $($cef.Count)" }
          "W6_CEF=$($cef[0].FullName)" >> $env:GITHUB_ENV
          node scripts/stage-windows-cef.mjs --unsandboxed-candidate --cef $cef[0].FullName --bin "$env:CARGO_TARGET_DIR\debug"
          if ($LASTEXITCODE -ne 0) { throw "The product stage failed (exit $LASTEXITCODE)" }
      - name: Build and stage the fixture browser
        id: fixture-stage
        if: ${{ !cancelled() && steps.product-stage.outcome == 'success' }}
        working-directory: takosumi-mobile
        env:
          CEF_PATH: ${{ runner.temp }}\cef
        run: |
          Push-Location native-tests/cef-candidate
          cargo build --locked --features fixture-inspection,windows-unsandboxed-candidate --bin takosumi-cef-browser-process --bin takosumi-browser-guard
          $built = $LASTEXITCODE
          Pop-Location
          if ($built -ne 0) { throw "The fixture browser build failed (exit $built)" }
          node scripts/stage-windows-cef.mjs --fixture --cef $env:W6_CEF --bin "$env:CARGO_TARGET_DIR\debug"
          if ($LASTEXITCODE -ne 0) { throw "The fixture stage failed (exit $LASTEXITCODE)" }
      # Both installers share Tauri's bundle path, so each is copied aside
      # (never uploaded) before the next build.
      - name: Build the fixture installer (NSIS, unsigned)
        id: fixture-installer
        if: ${{ !cancelled() && steps.fixture-stage.outcome == 'success' }}
        working-directory: takosumi-mobile
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: |
          bunx tauri build --ci --debug --bundles nsis --features native-browser-process-fixture --config src-tauri/tauri.windows-cef-fixture.conf.json
          if ($LASTEXITCODE -ne 0) { throw "The fixture installer build failed (exit $LASTEXITCODE)" }
          # This overlay's own installer only: the bundle directory may also
          # hold the other installer (they differ by productName).
          $product = (Get-Content -Raw src-tauri/tauri.windows-cef-fixture.conf.json | ConvertFrom-Json).productName
          if (-not $product) { $product = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).productName }
          $setup = @(Get-ChildItem -LiteralPath "$env:CARGO_TARGET_DIR\debug\bundle\nsis" -File | Where-Object { $_.Name -like "$($product)_*_x64-setup.exe" })
          if ($setup.Count -ne 1) { throw "Expected one NSIS installer of $product, found $($setup.Count)" }
          Copy-Item -LiteralPath $setup[0].FullName -Destination "$env:RUNNER_TEMP\w6-fixture-setup.exe"
          "Fixture installer: $($setup[0].Name), $([math]::Round($setup[0].Length / 1MB)) MiB"
      - name: Fixture site TLS (disposable CA trusted for this run)
        id: w6-tls
        if: ${{ !cancelled() && steps.fixture-installer.outcome == 'success' }}
        working-directory: takosumi-mobile
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File native-tests/desktop/windows_fixture_tls.ps1 -Out "$env:RUNNER_TEMP\w6-tls"
          if ($LASTEXITCODE -ne 0) { throw "The fixture TLS setup failed (exit $LASTEXITCODE)" }
      - name: Install the fixture App (silent, per user)
        id: fixture-install
        if: ${{ !cancelled() && steps.w6-tls.outcome == 'success' }}
        working-directory: takosumi-mobile
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'w6-fixture-app'
          $report = Join-Path $env:RUNNER_TEMP 'w6-fixture-install.json'
          python -B native-tests/desktop/windows_package.py install --installer "$env:RUNNER_TEMP\w6-fixture-setup.exe" --dir $dir --manifest src-tauri/target/windows-cef-fixture/stage.json --report $report
          if ($LASTEXITCODE -ne 0) { throw "The fixture install failed (exit $LASTEXITCODE)" }
          $installed = Get-Content -Raw $report | ConvertFrom-Json
          "W6_FIXTURE_APP=$(Join-Path $dir $installed.app)" >> $env:GITHUB_ENV
      # The W3 case against the installed App: it resolves its bundled browser,
      # guard and runtime root itself (no fixture override). Every required
      # case must pass and exactly these ten run.
      - name: Packaged actual App cases (home, per-profile CEF, reuse, quit, restart, clear)
        id: w6-run
        if: ${{ !cancelled() && steps.fixture-install.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: takosumi-mobile
        run: |
          $name = 'sumi-w6'
          $case = Join-Path ([System.IO.Path]::GetTempPath()) $name
          "W6_CASE=$case" >> $env:GITHUB_ENV
          "W6_APP_DATA=$env:LOCALAPPDATA\com.takosumi.fixture.browserprocess.$name" >> $env:GITHUB_ENV
          $tls = Join-Path $env:RUNNER_TEMP 'w6-tls'
          $log = Join-Path $env:RUNNER_TEMP 'w6-cases.log'
          python -B native-tests/desktop/windows_browser_process.py --packaged --binary $env:W6_FIXTURE_APP --data $case --tls-cert "$tls\cert.pem" --tls-key "$tls\key.pem" --tls-ca "$tls\ca.pem" --restart --reset | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Packaged W3 cases failed (exit $LASTEXITCODE)" }
          $w6Cases = @(
            'separate-profiles',
            'home-by-window-switch',
            'reuse-raises-window',
            'quit-cancel-stops',
            'quit-partial-order',
            'quit-completes',
            'restart-keeps-separation',
            'clear-only-one-profile',
            'no-process-left',
            'no-opener-request'
          )
          foreach ($case_name in $w6Cases) {
            if (-not (Select-String -Path $log -Pattern "^PASS case $([regex]::Escape($case_name))$" -Quiet)) { throw "Packaged case $case_name did not pass" }
          }
          $w6Count = @(Select-String -Path $log -Pattern '^PASS case ').Count
          if ($w6Count -ne 10) { throw "Expected exactly ten packaged cases, saw $w6Count" }
          $summary = Get-Content -Raw (Join-Path $case 'summary.json') | ConvertFrom-Json
          if ($summary.passed -ne $true -or $summary.packaged -ne $true) { throw 'The packaged summary did not pass' }
      - name: Uninstall the fixture App (silent)
        if: ${{ !cancelled() && steps.fixture-install.outcome == 'success' }}
        working-directory: takosumi-mobile
        run: |
          # The productName its installer was built with (its uninstall key and shortcut).
          $product = (Get-Content -Raw src-tauri/tauri.windows-cef-fixture.conf.json | ConvertFrom-Json).productName
          if (-not $product) { $product = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).productName }
          python -B native-tests/desktop/windows_package.py uninstall --dir "$env:RUNNER_TEMP\w6-fixture-app" --report "$env:RUNNER_TEMP\w6-fixture-uninstall.json" --product $product
          if ($LASTEXITCODE -ne 0) { throw "The fixture uninstall failed (exit $LASTEXITCODE)" }
      - name: Build the product installer (NSIS, unsigned)
        id: product-installer
        if: ${{ !cancelled() && steps.product-stage.outcome == 'success' }}
        working-directory: takosumi-mobile
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: |
          bunx tauri build --ci --debug --bundles nsis --features desktop-cef --config src-tauri/tauri.windows-cef.conf.json
          if ($LASTEXITCODE -ne 0) { throw "The product installer build failed (exit $LASTEXITCODE)" }
          # This overlay's own installer only: the bundle directory may also
          # hold the other installer (they differ by productName).
          $product = (Get-Content -Raw src-tauri/tauri.windows-cef.conf.json | ConvertFrom-Json).productName
          if (-not $product) { $product = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).productName }
          $setup = @(Get-ChildItem -LiteralPath "$env:CARGO_TARGET_DIR\debug\bundle\nsis" -File | Where-Object { $_.Name -like "$($product)_*_x64-setup.exe" })
          if ($setup.Count -ne 1) { throw "Expected one NSIS installer of $product, found $($setup.Count)" }
          Copy-Item -LiteralPath $setup[0].FullName -Destination "$env:RUNNER_TEMP\w6-setup.exe"
          "Product installer: $($setup[0].Name), $([math]::Round($setup[0].Length / 1MB)) MiB"
      - name: Install the product App (silent, per user)
        id: product-install
        if: ${{ !cancelled() && steps.product-installer.outcome == 'success' }}
        working-directory: takosumi-mobile
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'w6-app'
          $report = Join-Path $env:RUNNER_TEMP 'w6-install.json'
          python -B native-tests/desktop/windows_package.py install --installer "$env:RUNNER_TEMP\w6-setup.exe" --dir $dir --manifest src-tauri/target/windows-cef/stage.json --report $report
          if ($LASTEXITCODE -ne 0) { throw "The product install failed (exit $LASTEXITCODE)" }
          $installed = Get-Content -Raw $report | ConvertFrom-Json
          "W6_APP=$(Join-Path $dir $installed.app)" >> $env:GITHUB_ENV
      # The installed product browser (no inspection seam) on its own, as
      # W1 runs the built one: boot open, shutdown, stopped, exit 0, nothing
      # left in its job.
      - name: Run the installed product browser alone
        if: ${{ !cancelled() && steps.product-install.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: takosumi-mobile
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'w6-browser-smoke'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          python -B native-tests/cef-candidate/windows_smoke.py --browser "$env:RUNNER_TEMP\w6-app\cef\takosumi-cef-browser-process.exe" --work $work | Tee-Object -FilePath "$env:RUNNER_TEMP\w6-browser-smoke.log"
          if ($LASTEXITCODE -ne 0) { throw "The installed browser smoke failed (exit $LASTEXITCODE)" }
      - name: Launch the installed product App once
        if: ${{ !cancelled() && steps.product-install.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: takosumi-mobile
        run: |
          python -B native-tests/desktop/windows_package.py smoke --exe $env:W6_APP --log "$env:RUNNER_TEMP\w6-smoke-app.log" --report "$env:RUNNER_TEMP\w6-smoke.json" --seconds 8
          if ($LASTEXITCODE -ne 0) { throw "The installed App smoke failed (exit $LASTEXITCODE)" }
      - name: Uninstall the product App (silent)
        if: ${{ !cancelled() && steps.product-install.outcome == 'success' }}
        working-directory: takosumi-mobile
        run: |
          # The productName its installer was built with (its uninstall key and shortcut).
          $product = (Get-Content -Raw src-tauri/tauri.windows-cef.conf.json | ConvertFrom-Json).productName
          if (-not $product) { $product = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).productName }
          python -B native-tests/desktop/windows_package.py uninstall --dir "$env:RUNNER_TEMP\w6-app" --report "$env:RUNNER_TEMP\w6-uninstall.json" --product $product
          if ($LASTEXITCODE -ne 0) { throw "The product uninstall failed (exit $LASTEXITCODE)" }
      - name: Remove the fixture CA
        if: ${{ always() && steps.w6-tls.outcome != 'skipped' }}
        working-directory: takosumi-mobile
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File native-tests/desktop/windows_fixture_tls.ps1 -Out "$env:RUNNER_TEMP\w6-tls" -Remove
          if ($LASTEXITCODE -ne 0) { throw "The fixture CA was not removed (exit $LASTEXITCODE)" }
      # One directory for the evidence (the upload needs one root): the
      # reports and logs, both stage manifests, the packaged case and the
      # profiles' logs. No executable, library or installer is ever copied.
      - name: Gather the W6 evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'w6-evidence'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $never = @('.exe', '.dll', '.pdb', '.lib', '.msi', '.sys', '.node')
          function Copy-Evidence([System.IO.FileInfo]$file, [string]$target) {
            if ($never -contains $file.Extension.ToLowerInvariant()) { return }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          foreach ($pattern in @('w6-*.json', 'w6-*.log')) {
            foreach ($file in @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -File -Filter $pattern)) {
              Copy-Evidence $file (Join-Path $out $file.Name)
            }
          }
          $stages = @{
            'product-stage.json' = 'takosumi-mobile/src-tauri/target/windows-cef/stage.json'
            'fixture-stage.json' = 'takosumi-mobile/src-tauri/target/windows-cef-fixture/stage.json'
          }
          foreach ($name in $stages.Keys) {
            if (Test-Path -LiteralPath $stages[$name] -PathType Leaf) { Copy-Evidence (Get-Item -LiteralPath $stages[$name]) (Join-Path $out $name) }
          }
          if ($env:W6_CASE -and (Test-Path -LiteralPath $env:W6_CASE -PathType Container)) {
            $case = (Get-Item -LiteralPath $env:W6_CASE).FullName.TrimEnd('\')
            foreach ($file in @(Get-ChildItem -LiteralPath $case -Recurse -File)) {
              Copy-Evidence $file (Join-Path (Join-Path $out 'case') $file.FullName.Substring($case.Length + 1))
            }
          }
          $profiles = if ($env:W6_APP_DATA) { Join-Path $env:W6_APP_DATA 'browser-process-experiment' } else { '' }
          if ($profiles -and (Test-Path -LiteralPath $profiles -PathType Container)) {
            foreach ($profile in @(Get-ChildItem -LiteralPath $profiles -Directory)) {
              foreach ($file in @(Get-ChildItem -LiteralPath $profile.FullName -File -Filter '*.log')) {
                Copy-Evidence $file (Join-Path (Join-Path (Join-Path $out 'profiles') $profile.Name) $file.Name)
              }
            }
          }
          $kept = @(Get-ChildItem -LiteralPath $out -Recurse -File)
          "Gathered $($kept.Count) evidence files"
      - name: Keep the W6 evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cef-windows-package-evidence
          path: ${{ runner.temp }}/w6-evidence
          if-no-files-found: warn
          retention-days: 14
