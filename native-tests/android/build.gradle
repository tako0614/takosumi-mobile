buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'
    }
}
allprojects { repositories { google(); mavenCentral() } }

// Match src-tauri/gen/android/app/build.gradle.kts. The library otherwise
// gives its instrumentation APK minSdk (28) as targetSdk, hiding modern OS
// permission/storage behavior. This setting affects only the test harness.
project(':app-screen') {
    plugins.withId('com.android.library') {
        android.defaultConfig.targetSdk = 36
    }
}
