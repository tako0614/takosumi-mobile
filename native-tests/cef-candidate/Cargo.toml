[package]
name = "takosumi-cef-candidate"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# The native fixture's observation seam in takosumi-cef-browser-process: a
# loopback DevTools port and load markers when the App passes
# TAKOSUMI_BROWSER_PROCESS_INSPECT=1. Build fixture browsers with it; a
# browser staged for a package must be built without it.
fixture-inspection = []
# Windows only: the browser runs without Chromium's sandbox there (see
# `without_sandbox` in src/process_main.rs). A Windows build without this
# feature stops with a compile error, so an unsandboxed browser is built only
# when asked for by name: test candidates and CI, never a package. No effect
# on Linux.
windows-unsandboxed-candidate = []

[dependencies]
cef = { version = "=154.5.0", default-features = false, features = ["linux-x11"] }
serde_json = "1"
tauri = { version = "=2.11.5", default-features = false }
tauri-plugin-app-screen = { path = "../../src-tauri/plugins/app-screen", default-features = false, features = ["browser-process"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Linux and Windows (first candidate). On Windows build it with the guard,
# `--bin takosumi-cef-browser-process --bin takosumi-browser-guard --features
# windows-unsandboxed-candidate`: the standalone `takosumi-cef-candidate`
# (src/main.rs) is Linux only and refuses to compile elsewhere.
[[bin]]
name = "takosumi-cef-browser-process"
path = "src/process_main.rs"

# Product supervisor for one browser process: src/guard_main.rs on Linux
# (pidfds, signalfd, the child subreaper) and src/guard_windows.rs on Windows
# (Job Objects), chosen by src/guard_entry.rs; any other OS refuses to
# compile, so no inert supervisor can be staged by mistake. Its self-tests run
# the guard as a separate process, so libtest is not used.
[[bin]]
name = "takosumi-browser-guard"
path = "src/guard_entry.rs"
harness = false

[profile.dev]
debug = 0
incremental = false
