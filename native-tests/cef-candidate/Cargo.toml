[package]
name = "takosumi-cef-candidate"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# The native fixture's observation seam in takosumi-cef-browser-process: a
# loopback DevTools port and load markers when the App passes
# TAKOSUMI_BROWSER_PROCESS_INSPECT=1. Build fixture browsers with it; a
# browser staged for a package must be built without it.
fixture-inspection = []
# Windows only (W7): the sandboxed browser. CEF 154 ships no cef_sandbox
# library for embedders; its bootstrap.exe, renamed to the browser, sets up
# Chromium's sandbox and loads the browser as the DLL this crate's library
# builds (src/browser_dll.rs), so build it with `--lib`. The product stage
# (scripts/stage-windows-cef.mjs) takes this layout. No effect on Linux.
windows-sandbox = ["cef/sandbox"]
# Windows only: the executable without Chromium's sandbox (see
# `without_sandbox` in src/process_main.rs), for fixtures and diagnostics
# only; its stage needs --fixture --unsandboxed-candidate. A Windows browser
# built with neither feature stops with a compile error, so an unsandboxed
# browser is never built by accident. No effect on Linux.
windows-unsandboxed-candidate = []

[dependencies]
cef = { version = "=154.5.0", default-features = false, features = ["linux-x11"] }
serde_json = "1"
tauri = { version = "=2.11.5", default-features = false }
tauri-plugin-app-screen = { path = "../../src-tauri/plugins/app-screen", default-features = false, features = ["browser-process"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Windows (W7): the sandboxed browser, the DLL CEF's bootstrap.exe loads
# (`--features windows-sandbox --lib`); staged as
# takosumi-cef-browser-process.dll beside the renamed bootstrap. Empty on
# every other target and without the feature.
[lib]
name = "takosumi_cef_browser"
path = "src/browser_dll.rs"
crate-type = ["cdylib"]

# Linux, and on Windows the unsandboxed test candidate
# (`--bin takosumi-cef-browser-process --features windows-unsandboxed-candidate`);
# the standalone `takosumi-cef-candidate` (src/main.rs) is Linux only and
# refuses to compile elsewhere.
[[bin]]
name = "takosumi-cef-browser-process"
path = "src/browser_main.rs"

# Product supervisor for one browser process: src/guard_main.rs on Linux
# (pidfds, signalfd, the child subreaper) and src/guard_windows.rs on Windows
# (Job Objects), chosen by src/guard_entry.rs; any other OS refuses to
# compile, so no inert supervisor can be staged by mistake. Its self-tests run
# the guard as a separate process, so libtest is not used.
[[bin]]
name = "takosumi-browser-guard"
path = "src/guard_entry.rs"
harness = false

[profile.dev]
debug = 0
incremental = false
