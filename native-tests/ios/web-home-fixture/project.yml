name: WebHomeDriver
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SDKROOT: iphonesimulator
    SUPPORTED_PLATFORMS: iphonesimulator
    CODE_SIGNING_ALLOWED: 'NO'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  WebHomeDriver:
    type: application
    platform: iOS
    sources:
      - ${SUMI_WEB_HOME_SOURCE}/Driver.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takosumi.fixture.webhome-driver
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
  WebHomeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ${SUMI_WEB_HOME_SOURCE}/WebHomeUITests.swift
    dependencies:
      - target: WebHomeDriver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takosumi.fixture.webhome-driver.tests
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: WebHomeDriver
schemes:
  WebHomeDriver:
    build:
      targets:
        WebHomeDriver: all
        WebHomeUITests: [test]
    test:
      targets: [WebHomeUITests]
      gatherCoverageData: false
      environmentVariables:
        SUMI_WEB_HOME_URL: ${SUMI_WEB_HOME_URL}
        SUMI_WEB_EDITOR_URL: ${SUMI_WEB_EDITOR_URL}
