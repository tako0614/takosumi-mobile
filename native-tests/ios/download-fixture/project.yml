name: DownloadFixture
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SDKROOT: iphonesimulator
    SUPPORTED_PLATFORMS: iphonesimulator
    CODE_SIGNING_ALLOWED: 'NO'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  DownloadFixture:
    type: application
    platform: iOS
    sources:
      - ${SUMI_DOWNLOAD_SOURCE}/App.swift
      - ${SUMI_DOWNLOAD_PRODUCT}/AppScreenViewController.swift
      - ${SUMI_DOWNLOAD_PRODUCT}/AppScreenPolicy.swift
      - ${SUMI_DOWNLOAD_PRODUCT}/AppScreenDownload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takosumi.fixture.download
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) SUMI_DOWNLOAD_FIXTURE'
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_FILE: ${SUMI_DOWNLOAD_SOURCE}/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Download Fixture
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
  DownloadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ${SUMI_DOWNLOAD_SOURCE}/DownloadUITests.swift
    dependencies:
      - target: DownloadFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takosumi.fixture.download.tests
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: DownloadFixture
schemes:
  DownloadFixture:
    build:
      targets:
        DownloadFixture: all
        DownloadUITests: [test]
    test:
      targets: [DownloadUITests]
      gatherCoverageData: false
      environmentVariables:
        SUMI_DOWNLOAD_URL: ${SUMI_DOWNLOAD_URL}
