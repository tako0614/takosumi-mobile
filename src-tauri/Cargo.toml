[package]
name = "takosumi-mobile"
version = "0.1.0"
description = "Takosumi mobile client"
authors = ["Takos"]
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"

[lib]
name = "takosumi_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Linux product path: each connection opens in its own guarded CEF browser
# process, found in the bundle's `cef/` resources (see
# native-tests/cef-candidate/README.md, "Linux packaging"). No fixture driver.
# Windows compiles the same adapter for the unsandboxed test candidate
# ("Windows browser process"); nothing is packaged for Windows yet.
desktop-cef = ["tauri-plugin-app-screen/desktop-process-experiment"]
# Explicit actual-App fixture: the real home drives the per-profile CEF
# browser (tests/desktop/browser_process.rs) on Linux and Windows; never
# enabled by normal builds or releases. Only Linux takes the GTK/WebKit
# driver pieces; the Windows driver uses Tauri's own API (WebView2 through
# eval_with_callback) and no further dependency.
native-browser-process-fixture = ["desktop-cef", "tauri-plugin-app-screen/fixture-overrides", "tauri/custom-protocol", "native-fixture-gtk"]
# The actual-App fixtures' GTK/WebKit driver pieces. They are Linux-only
# optional dependencies (see the Linux target section), so nothing is
# resolved or built for them on other OSes. Not a product feature.
native-fixture-gtk = ["dep:gtk", "dep:webkit2gtk", "dep:javascriptcore-rs"]
# Explicit actual-App fixture; never enabled by normal builds or releases.
native-web-home-fixture = ["tauri/custom-protocol", "native-fixture-gtk"]

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2.3.2"
tauri-plugin-store = "2"
tauri-plugin-stronghold = "2.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0", features = ["v2_40"], optional = true }
javascriptcore-rs = { version = "1.1", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-app-screen = { path = "plugins/app-screen", features = ["desktop"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-app-screen = { path = "plugins/app-screen" }
tauri-plugin-barcode-scanner = "2"
tauri-plugin-biometric = "2.3.2"
tauri-plugin-keystore = { path = "plugins/keystore" }
tauri-plugin-takosumi-push = { path = "plugins/push" }

[patch.crates-io]
tauri-winrt-notification = { git = "https://github.com/tauri-apps/winrt-notification", rev = "09a4135a871c6ead29832dca5698948fb30bf94b" }
